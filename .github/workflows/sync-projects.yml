name: Sync GitHub Projects

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sync dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet pypdf

      - name: Fetch GitHub repositories
        id: fetch-repos
        env:
          GITHUB_USERNAME: Luizlfc-dev
        run: |
          echo "Fetching repos for $GITHUB_USERNAME..."
          REPOS=$(curl -s "https://api.github.com/users/$GITHUB_USERNAME/repos?per_page=100&sort=updated" \
            -H "Accept: application/vnd.github.v3+json")
          echo "$REPOS" > /tmp/repos.json
          echo "repos_file=/tmp/repos.json" >> $GITHUB_OUTPUT

      - name: Fetch READMEs
        env:
          GITHUB_USERNAME: Luizlfc-dev
        run: |
          mkdir -p /tmp/readmes
          REPO_NAMES=$(cat /tmp/repos.json | python3 -c "
          import json, sys
          repos = json.load(sys.stdin)
          for r in repos:
            if not r.get('fork', False) and r['name'] != '$GITHUB_USERNAME':
              print(r['name'])
          ")

          for repo in $REPO_NAMES; do
            echo "Fetching README for $repo..."
            README=$(curl -s "https://api.github.com/repos/$GITHUB_USERNAME/$repo/readme" \
              -H "Accept: application/vnd.github.v3+json" | python3 -c "
          import json, sys, base64
          try:
            data = json.load(sys.stdin)
            content = base64.b64decode(data['content']).decode('utf-8')
            print(content)
          except:
            print('')
          ")
            echo "$README" > "/tmp/readmes/$repo.md"
          done

      - name: Categorize with AI or fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import re
          import subprocess
          import unicodedata
          import urllib.request
          from datetime import datetime, timezone
          from pypdf import PdfReader
          
          github_username = "Luizlfc-dev"
          exclude_repos = []
          certificates_dir = "certificates"
          
          
          def heuristic_categorize(name, description, language, readme):
            text = f"{name} {description} {readme}".lower()
            if any(w in text for w in ['react native', 'expo', 'mobile', 'android', 'ios']):
              return 'Mobile'
            if any(w in text for w in ['automation', 'automação', 'home assistant', 'jarvis', 'alexa', 'iot']):
              return 'Automação'
            if any(w in text for w in ['html', 'css', 'frontend', 'website', 'web', 'react', 'freecodecamp']):
              return 'Web'
            if any(w in text for w in ['hardware', 'rede', 'network', 'server', 'servidor']):
              return 'Hardware/Redes'
            if language in ['C#', 'Python', 'Java', 'Go']:
              return 'Back-end'
            return 'Web'
          
          
          def categorize_project(name, description, language, readme):
            api_key = os.getenv('GEMINI_API_KEY', '')
            if api_key:
              try:
                prompt = (
                  "Categorize this project into one of: Back-end, Automação, Web, Mobile, Hardware/Redes. "
                  f"Project: {name}. Description: {description}. Language: {language}. "
                  f"README excerpt: {readme[:300]}. Reply with ONLY the category name."
                )
                data = json.dumps({
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"maxOutputTokens": 20, "temperature": 0}
                }).encode()
                url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={api_key}"
                req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})
                resp = urllib.request.urlopen(req, timeout=15)
                result = json.loads(resp.read())
                cat = result['candidates'][0]['content']['parts'][0]['text'].strip()
                valid = ['Back-end', 'Automação', 'Web', 'Mobile', 'Hardware/Redes']
                for v in valid:
                  if v.lower() in cat.lower():
                    return v
              except Exception as e:
                print(f"AI categorization failed for {name}: {e}")
            return heuristic_categorize(name, description, language, readme)
          
          
          def humanize_name(name):
            name = name.replace('-', ' ').replace('_', ' ')
            name = name.replace('.github.io', ' (Site)')
            return ' '.join(word.capitalize() for word in name.split())
          
          
          def slugify(text):
            text = text.lower().strip()
            text = re.sub(r'[^a-z0-9]+', '-', text)
            return text.strip('-')
          
          
          def generate_description(name, readme):
            if readme:
              lines = readme.strip().split('\n')
              for line in lines:
                clean = line.strip('#').strip()
                if len(clean) > 20 and not clean.startswith('!'):
                  return clean[:150]
            return f"Projeto {humanize_name(name)}"
          
          
          def get_technologies(repo, readme):
            techs = []
            lang = repo.get('language', '')
            if lang:
              techs.append(lang)
            text = f"{repo.get('description', '')} {readme}".lower()
            tech_map = {
              '.net': '.NET', 'asp.net': 'ASP.NET', 'maui': '.NET MAUI',
              'avalonia': 'Avalonia', 'docker': 'Docker',
              'sql server': 'SQL Server', 'mysql': 'MySQL',
              'react': 'React', 'react native': 'React Native', 'expo': 'Expo',
              'node': 'Node.js', 'python': 'Python', 'java': 'Java', 'spring': 'Spring Boot',
              'home assistant': 'Home Assistant', 'ollama': 'Ollama',
              'whisper': 'Whisper', 'piper': 'Piper',
              'html': 'HTML', 'css': 'CSS', 'javascript': 'JavaScript',
              'wsl': 'WSL', 'azure': 'Azure'
            }
            for keyword, tech_name in tech_map.items():
              if keyword in text and tech_name not in techs:
                techs.append(tech_name)
            return techs[:6]
          
          
          def discover_certificates():
            certs = []
            allowed = {'.pdf', '.png', '.jpg', '.jpeg', '.webp'}
            
            def normalize_spaces(text):
              return re.sub(r'\s+', ' ', text or '').strip()

            def strip_accents(text):
              return ''.join(ch for ch in unicodedata.normalize('NFD', text or '') if unicodedata.category(ch) != 'Mn')

            def infer_title_from_filename(filename):
              base = os.path.splitext(filename)[0]
              base = re.sub(r'\(\d+\)', ' ', base)
              base = re.sub(r'[_\-]+', ' ', base)
              base = normalize_spaces(base)
              normalized = strip_accents(base).lower()
              if "powerpoint" in normalized or "ppt" in normalized:
                return "Microsoft PowerPoint 2016"
              if "excel" in normalized:
                return "Microsoft Excel 2016"
              if "word" in normalized:
                return "Microsoft Word 2016"
              if re.fullmatch(r'certificado(?: de conclusao)?', normalized):
                return "Certificado de Conclusão"
              return base.title() if base else filename

            def extract_pdf_text(path):
              pages_text = []
              try:
                reader = PdfReader(path)
                for page in reader.pages[:2]:
                  page_text = page.extract_text() or ""
                  if page_text.strip():
                    pages_text.append(page_text)
              except Exception:
                pass

              if pages_text:
                return "\n".join(pages_text)

              try:
                output = subprocess.check_output(["pdftotext", "-f", "1", "-l", "2", path, "-"], stderr=subprocess.DEVNULL, timeout=20)
                return output.decode("utf-8", errors="ignore")
              except Exception:
                return ""

            def parse_certificate_metadata(filename, text):
              fallback_title = infer_title_from_filename(filename)
              if not text:
                return fallback_title or filename, "Certificado", "", ""

              lines = [normalize_spaces(l) for l in re.split(r'[\r\n]+', text) if normalize_spaces(l)]
              lowered = [l.lower() for l in lines]
              collapsed = normalize_spaces(text)
              normalized_text = strip_accents(collapsed).lower()

              title = fallback_title or filename
              title_patterns = [
                r'certific(?:amos|a(?:do|ção)?)\s+que.*?(?:curso|formação)\s+(?:de|em)\s+([A-ZÀ-ÿ][^\n\.,]{4,120})',
                r'curso\s+(?:de|em)\s+([A-ZÀ-ÿ][^\n\.,]{4,120})',
                r't[íi]tulo\s*[:\-]\s*([A-ZÀ-ÿ][^\n]{4,120})',
              ]
              for patt in title_patterns:
                m = re.search(patt, text, flags=re.IGNORECASE | re.DOTALL)
                if m:
                  candidate = normalize_spaces(m.group(1))
                  if 6 <= len(candidate) <= 120:
                    title = candidate
                    break

              if title == fallback_title:
                for line in lines:
                  normalized_line = strip_accents(line).lower()
                  if (
                    8 <= len(line) <= 90
                    and "certificado" not in normalized_line
                    and "certificate" not in normalized_line
                    and "emitido" not in normalized_line
                    and "issued" not in normalized_line
                    and "carga horaria" not in normalized_line
                  ):
                    title = line
                    break

              if title and title.lower().startswith("certificado") and fallback_title:
                title = fallback_title

              issuer = "Certificado"
              if "fundacao bradesco" in normalized_text or "escola virtual" in normalized_text:
                issuer = "Fundação Bradesco | Escola Virtual"
              elif "microsoft learn" in normalized_text:
                issuer = "Microsoft Learn"
              else:
                issuer_patterns = [
                  r'(?:emitido por|issued by|organiza[çc][aã]o|institui[çc][aã]o)\s*[:\-]\s*([^\.;\n]+)',
                  r'((?:funda[çc][aã]o|instituto|universidade|microsoft|google|udemy|alura|bradesco)[^\.;\n]{0,80})'
                ]
                for patt in issuer_patterns:
                  m = re.search(patt, text, flags=re.IGNORECASE)
                  if m:
                    issuer = normalize_spaces(m.group(1) if m.lastindex else m.group(0))
                    break

              if issuer == "Certificado":
                for idx, line in enumerate(lowered):
                  if "emitido por" in line or "issued by" in line:
                    issuer = lines[idx].split(":")[-1].strip() or lines[idx]
                    break

              workload = ""
              mh = re.search(r'carga\s*hor[áa]ria\s*(?:de|:)?\s*(\d{1,3})\s*(?:h|horas?)\b', text, flags=re.IGNORECASE)
              if not mh:
                mh = re.search(r'(\d{1,3})\s*(?:h|horas?)\b', text, flags=re.IGNORECASE)
              if mh:
                workload = f"{mh.group(1)}h"

              issued_at = ""
              dm = re.search(r'\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\b', text)
              if dm:
                issued_at = dm.group(1)
              else:
                month_pt = {
                  "jan": "Jan", "fev": "Fev", "mar": "Mar", "abr": "Abr", "mai": "Mai", "jun": "Jun",
                  "jul": "Jul", "ago": "Ago", "set": "Set", "out": "Out", "nov": "Nov", "dez": "Dez"
                }
                mm = re.search(r'\b(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*[\/\-\s]+(\d{4})\b', normalized_text, flags=re.IGNORECASE)
                if mm:
                  issued_at = f"{month_pt[mm.group(1).lower()]}/{mm.group(2)}"
                else:
                  ext = re.search(r'\b(\d{1,2})\s+de\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\s+de\s+(\d{4})\b', normalized_text, flags=re.IGNORECASE)
                  if ext:
                    issued_at = f"{ext.group(1).zfill(2)}/{list(month_pt).index(ext.group(2).lower()) + 1:02d}/{ext.group(3)}"

              return title, issuer, workload, issued_at

            if not os.path.isdir(certificates_dir):
              return certs
            for root, _, files in os.walk(certificates_dir):
              for filename in files:
                ext = os.path.splitext(filename)[1].lower()
                if ext not in allowed:
                  continue
                if filename.lower().startswith('.'):
                  continue
                full_path = os.path.join(root, filename)
                rel_path = os.path.relpath(full_path, '.').replace('\\', '/')
                pdf_text = extract_pdf_text(full_path) if ext == ".pdf" else ""
                title, issuer, workload, issued_at = parse_certificate_metadata(filename, pdf_text)
                certs.append({
                  "id": slugify(os.path.splitext(rel_path)[0]),
                  "title": title,
                  "issuer": issuer,
                  "workload": workload,
                  "issuedAt": issued_at,
                  "fileUrl": rel_path
                })
            certs.sort(key=lambda c: c['title'].lower())
            return certs
          
          
          repos_data = json.load(open('/tmp/repos.json'))
          repos = [r for r in repos_data if not r.get('fork', False) and r['name'] not in exclude_repos]
          projects = []
          
          for repo in repos:
            name = repo['name']
            readme_path = f"/tmp/readmes/{name}.md"
            readme = open(readme_path).read()[:1000] if os.path.exists(readme_path) else ""
            category = categorize_project(name, repo.get('description', ''), repo.get('language', ''), readme)
            project = {
              "id": name.lower().replace(' ', '-'),
              "title": humanize_name(name),
              "shortDescription": repo.get('description', '') or generate_description(name, readme),
              "fullDescription": readme[:500] if readme else repo.get('description', ''),
              "technologies": get_technologies(repo, readme),
              "category": category,
              "heroImage": "",
              "repoUrl": repo['html_url'],
              "liveUrl": repo.get('homepage', '') or '',
              "language": repo.get('language', '') or 'N/A',
              "stars": repo.get('stargazers_count', 0),
              "forks": repo.get('forks_count', 0),
              "updated_at": repo.get('updated_at', ''),
              "created_at": repo.get('created_at', '')
            }
            projects.append(project)
          
          projects.sort(key=lambda p: p.get('updated_at', ''), reverse=True)
          certificates = discover_certificates()
          
          output = {
            "projects": projects,
            "certificates": certificates,
            "lastSync": datetime.now(timezone.utc).isoformat(),
            "lastCertificatesSync": datetime.now(timezone.utc).isoformat()
          }
          
          with open('data.json', 'w', encoding='utf-8') as f:
            json.dump(output, f, indent=2, ensure_ascii=False)
          
          print(f"✅ Synced {len(projects)} projects")
          print(f"✅ Synced {len(certificates)} certificates from /{certificates_dir}")
          PYTHON_SCRIPT

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto-sync: update projects and certificates"
            git push
          fi
